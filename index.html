    <script type="text/babel">
        // 導入 useRef 以處理檔案上傳

        // === ⚠️ 請在這裡填寫您的 API Key ===
        const apiKey = "AIzaSyAyoq9BHbHdbOFd0_PZ3sSBOzOkD--2jxE"; 
        // ===================================

        // 內建圖示庫 (新增 Upload 與 Download 圖示)
        const Icons = {
            Database: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,

            Plus: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Trash2: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            Upload: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            Download: (p) => <svg xmlns="http://www.w3.org/2000/svg" width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        };

        // --- 核心工具：零相依的企業級 CSV 解析引擎 (支援引號與多行文本) ---
        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                
                if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { ++col; continue; }
                if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc === '\n' && !quote) { ++row; col = 0; continue; }
                if (cc === '\r' && !quote) { ++row; col = 0; continue; }
                
                arr[row][col] += cc;
            }
            return arr;
        };

        const fetchWithRetry = async (url, options, maxRetries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`Google API 錯誤 (${response.status}): ${errorData?.error?.message || '未知錯誤'}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    if (error.message.includes("API 錯誤 (400)") || error.message.includes("API 錯誤 (403)")) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        function App() {
            // 用於觸發隱藏的檔案上傳輸入框
            const fileInputRef = useRef(null);
            const mdmFileInputRef = useRef(null); // 新增：MDM 字典上傳的 Ref

            const [mdmEntries, setMdmEntries] = useState([
                { id: 1, code: 'ONC_STAT', desc: '疾病狀態', values: 'CUR 現症 / HIS 既往症' },
                { id: 2, code: 'ONC_STG', desc: '癌症分期', values: '0 原位癌 / 1 一期 / 2 二期 ...' },
                { id: 3, code: 'ONC_TIM_TRT', desc: '距治療結束時間', values: 'M00_M05 <6個月 / M06_M11 6月~1年 / Y01_Y02 1~2年 ...' },
                { id: 4, code: 'ONC_DEM_AGE', desc: '診斷年齡', values: 'LE35 <=35歲 / GT35 >35歲' },
                { id: 5, code: 'ONC_TRT_SURG', desc: '手術方式', values: 'TOTAL 全切除 / PARTIAL 部分切除' },
            ]);

            const [diseaseEntries, setDiseaseEntries] = useState([
                { id: 1, name: '子宮頸癌', code: 'ICD_C53', prefix: 'CER', type: '壽險', text: '1.現症-----D。\n2.既往症： \n  (1)原位癌： \n     A.治療後且細胞抹片檢查正常<6個月-----P。 \n     B.治療後且細胞抹片檢查正常6個月~1年-----75。' },
                { id: 2, name: '乳癌', code: 'ICD_C50', prefix: 'BRE', type: '壽險', text: '1.現症-----D。\n2.既往症： \n  (1)原位癌： \n     A.乳房全切者-----0。\n     B.乳房部分切除者： \n      (a)診斷年齡≦35歲： \n        I.治療後<6個月-----P。' }
            ]);

            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);
            
            const [dictionaryData, setDictionaryData] = useState([]);
            const [matrixData, setMatrixData] = useState([]);
            const [activeOutputTab, setActiveOutputTab] = useState('matrix');
            const [copyStatus, setCopyStatus] = useState({ dict: false, matrix: false });

            // MDM Table Handlers
            const addMdmRow = () => setMdmEntries([...mdmEntries, { id: Date.now(), code: '', desc: '', values: '' }]);
            const updateMdmRow = (id, field, value) => {
                setMdmEntries(mdmEntries.map(entry => entry.id === id ? { ...entry, [field]: value } : entry));
            };
            const removeMdmRow = (id) => setMdmEntries(mdmEntries.filter(entry => entry.id !== id));

            // Disease Table Handlers
            const addDiseaseRow = () => setDiseaseEntries([...diseaseEntries, { id: Date.now(), name: '', code: '', prefix: '', type: '壽險', text: '' }]);
            const updateDiseaseRow = (id, field, value) => {
                setDiseaseEntries(diseaseEntries.map(entry => entry.id === id ? { ...entry, [field]: value } : entry));
            };
            const removeDiseaseRow = (id) => setDiseaseEntries(diseaseEntries.filter(entry => entry.id !== id));
            // 批次清空
            const clearDiseaseRows = () => {
                if(confirm('確定要清空目前的所有疾病紀錄嗎？')) setDiseaseEntries([]);
            };

            // --- MDM 主字典 CSV 下載與上傳功能 ---
            const clearMdmRows = () => {
                if(confirm('確定要清空目前的所有主字典參數嗎？')) setMdmEntries([]);
            };

            const downloadMdmTemplate = () => {
                const headers = "參數代碼,中文描述,數值定義\n";
                const sampleData = "ONC_STAT,疾病狀態,CUR 現症 / HIS 既往症\nONC_STG,癌症分期,0 原位癌 / 1 一期 / 2 二期\nONC_TIM_TRT,距治療結束時間,M00_M05 <6個月 / Y01_Y02 1~2年\n";
                // 加上 \uFEFF 確保 Excel 繁體中文不會變亂碼
                const blob = new Blob(["\uFEFF" + headers + sampleData], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.setAttribute("download", "企業主資料字典_批次匯入範本.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleMdmFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        const parsedData = parseCSV(text);
                        const dataRows = parsedData.slice(1); // 移除標題列
                        
                        const newEntries = dataRows
                            .filter(row => row.length >= 3 && row[0].trim() !== '')
                            .map((row, index) => ({
                                id: Date.now() + index,
                                code: row[0].trim(),
                                desc: row[1].trim(),
                                values: row[2].trim()
                            }));

                        if (newEntries.length === 0) {
                            setError("字典匯入失敗：檔案格式不符或沒有有效資料，請下載範例格式。");
                            return;
                        }

                        // 將匯入的字典附加到現有列表後方
                        setMdmEntries(prev => [...prev, ...newEntries]);
                        setError(null);
                        
                    } catch (err) {
                        setError("讀取字典 CSV 發生錯誤：" + err.message);
                    }
                };
                reader.readAsText(file);
                e.target.value = null; // 重置 input 允許重複上傳
            };

            // --- 疾病審查標準 下載 CSV 範本功能 ---
            const downloadTemplate = () => {
                const headers = "疾病名稱,ICD代碼,規則前綴,險種,審查標準原文\n";
                // 填入一筆範例，展現如何透過 Excel 輸入多行文字
                const sampleData = "大腸直腸癌,ICD_C18,COL,壽險,\"1.現症-----D。\n2.既往症：\n  (1)原位癌：\n     A.治療後<6個月-----P。\"\n";
                // 加上 \uFEFF (Byte Order Mark) 確保 Excel 繁體中文不會變亂碼
                const blob = new Blob(["\uFEFF" + headers + sampleData], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.setAttribute("download", "核保規則批次匯入範本.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- 處理 CSV 檔案上傳 ---
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        const parsedData = parseCSV(text);
                        
                        // 移除標題列 (假設第一列為標題)
                        const dataRows = parsedData.slice(1);
                        
                        // 將 CSV 陣列對應到 React 狀態物件，並過濾掉全空的列
                        const newEntries = dataRows
                            .filter(row => row.length >= 5 && row[0].trim() !== '')
                            .map((row, index) => ({
                                id: Date.now() + index, // 確保 ID 唯一
                                name: row[0].trim(),
                                code: row[1].trim(),
                                prefix: row[2].trim(),
                                type: row[3].trim(),
                                text: row[4].trim()
                            }));

                        if (newEntries.length === 0) {
                            setError("匯入失敗：檔案格式不符或沒有有效資料，請下載範例格式。");
                            return;
                        }

                        // 將匯入的資料「附加」到現有列表後方
                        setDiseaseEntries(prev => [...prev, ...newEntries]);
                        setError(null);
                        
                    } catch (err) {
                        setError("讀取 CSV 發生錯誤：" + err.message);
                    }
                };
                reader.readAsText(file);
                // 重置 input，允許連續上傳同一個檔案
                e.target.value = null;
            };

            const handleGenerate = async () => {
                const cleanApiKey = apiKey.trim();
                if (!cleanApiKey) return setError("錯誤：尚未設定 API Key。請在檔案原始碼第 23 行填入金鑰。");
                if (diseaseEntries.length === 0) return setError("請至少輸入一筆疾病標準");
                
                const hasEmptyDisease = diseaseEntries.some(d => !d.name || !d.text);
                if (hasEmptyDisease) return setError("請確認所有疾病的「名稱」與「審查標準」皆已填寫。");

                setIsLoading(true);
                setError(null);
                setCopyStatus({ dict: false, matrix: false });

                const mdmString = mdmEntries
                    .filter(e => e.code && e.desc)
                    .map(e => `- ${e.code} : ${e.desc} (值: ${e.values})`)
                    .join('\n');

                const batchDiseasePrompt = diseaseEntries
                    .map((d, index) => `
【疾病 ${index + 1}】
疾病名稱：${d.name}
疾病代碼 (ICD)：${d.code}
險種：${d.type}
規則編號前綴：${d.prefix}
審查標準：
${d.text}
------------------------`)
                    .join('\n');

                const systemInstruction = `
                你是一位精通醫療資訊學與商業保險核保規則引擎（Rules Engine）的架構師。
                你的任務是閱讀使用者提供的一系列「多筆癌症核保審查標準」，將其統一轉譯為單一的「參數代碼字典」與「決策矩陣表」。

                【企業標準參數字典 (Master Data Dictionary) - 絕對優先使用】
                請務必優先將文本中的風險因子對應到下列標準代碼，不允許隨意創造語意相同的不同變數名稱：
                ${mdmString}

                【擴充命名規範】
                只有當文本中出現上述標準字典「完全沒有涵蓋」的全新概念時，才允許創造新代碼（全大寫英文與底線）。

                【編碼邏輯指引】
                1. 規則編號 (ruleId) 必須使用該疾病提供的前綴字串加上三碼流水號，如 CER_001, BRE_001。不同疾病的流水號應各自獨立計算。
                2. "現症" 必須對應為 {code: "ONC_STAT", operator: "==", value: "CUR"}。
                3. "既往症" 必須對應為 {code: "ONC_STAT", operator: "==", value: "HIS"}。
                
                必須嚴格遵守 JSON Schema 格式輸出，將所有疾病的結果整合在同一個陣列中。不允許預測或假設未提及的條件。
                `;

                const payload = {
                    contents: [{ parts: [{ text: batchDiseasePrompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                        type: "OBJECT",
                        properties: {
                            dictionary: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                category: { type: "STRING" },
                                code: { type: "STRING" },
                                description: { type: "STRING" },
                                valueCode: { type: "STRING" },
                                valueDefinition: { type: "STRING" },
                                disease: { type: "STRING", description: "標註適用疾病名稱，若是共用則寫'通用'" }
                                }
                            }
                            },
                            matrix: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                ruleId: { type: "STRING" },
                                insuranceType: { type: "STRING" },
                                diseaseCode: { type: "STRING" },
                                conditions: {
                                    type: "ARRAY",
                                    items: {
                                    type: "OBJECT",
                                    properties: {
                                        code: { type: "STRING" },
                                        operator: { type: "STRING" },
                                        value: { type: "STRING" }
                                    }
                                    }
                                },
                                result: { type: "STRING" },
                                description: { type: "STRING" }
                                }
                            }
                            }
                        }
                        }
                    }
                };

                try {
                    // 更新為 Google 最新支援的 Gemini 2.5 Flash 模型
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanApiKey}`;
                    const data = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!responseText) throw new Error("API 回傳異常，無法生成有效資料。");

                    const parsedData = JSON.parse(responseText);
                    setDictionaryData(parsedData.dictionary || []);
                    setMatrixData(parsedData.matrix || []);
                } catch (err) {
                    console.error(err);
                    if (err.message.includes('429')) setError("資源配額不足 (429)：請確認 Google Cloud Console 是否已成功綁定信用卡。");
                    else if (err.message === 'Failed to fetch') setError("網路連線失敗：防火牆阻擋或瀏覽器擴充功能攔截請求。");
                    else setError(`系統異常：${err.message}`);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleCopyCSV = (type) => {
                let csvContent = "";
                if (type === 'dictionary') {
                    csvContent += "分類,參數代碼 (Code),中文描述 (Description),數值代碼 (Value Code),數值定義 (Value Definition),適用疾病\n";
                    dictionaryData.forEach(row => {
                        csvContent += `${row.category},${row.code},${row.description},${row.valueCode},${row.valueDefinition},${row.disease}\n`;
                    });
                } else if (type === 'matrix') {
                    csvContent += "規則編號,險種,疾病代碼,決策條件 (JSON陣列),審查結果,規則中文說明\n";
                    matrixData.forEach(row => {
                        const jsonString = JSON.stringify(row.conditions);
                        const escapedJsonString = jsonString.replace(/"/g, '""');
                        csvContent += `${row.ruleId},${row.insuranceType},${row.diseaseCode},"${escapedJsonString}",${row.result},${row.description}\n`;
                    });
                }

                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = csvContent;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    
                    setCopyStatus(prev => ({ ...prev, [type]: true }));
                    setTimeout(() => setCopyStatus(prev => ({ ...prev, [type]: false })), 2000);
                } catch (err) {
                    alert("複製失敗，請手動選取複製。");
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col gap-8 max-w-[1400px] mx-auto">
                    
                    {/* Header */}
                    <header className="flex items-center space-x-3 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div className="p-3 bg-blue-600 rounded-lg text-white">
                            <Icons.Database size={28} />
                        </div>
                        <div>
                            <h1 className="text-2xl font-bold text-slate-900">AI 批次核保規則結構化站 (Centralized MDM Console)</h1>
                            <p className="text-slate-500 text-sm mt-1">支援 Excel CSV 批次匯入，共享主資料字典，確保全險種參數代碼 100% 一致化。</p>
                        </div>
                    </header>

                    {/* Top Workspace Section */}
                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                        
                        {/* Left/Top: MDM Dictionary Table */}
                        <div className="xl:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[550px]">
                            <div className="p-4 border-b border-slate-100 bg-indigo-50/50 flex flex-col xl:flex-row xl:justify-between xl:items-center gap-3">
                                <h2 className="font-semibold text-indigo-800 flex items-center whitespace-nowrap">
                                    <Icons.Database size={18} className="mr-2" />
                                    企業主資料字典 (MDM)
                                </h2>
                                
                                <div className="flex flex-wrap items-center gap-1.5">
                                    <button onClick={downloadMdmTemplate} className="text-xs font-medium bg-white border border-slate-300 text-slate-600 px-2 py-1.5 rounded hover:bg-slate-50 flex items-center shadow-sm transition-transform active:scale-95" title="下載範本">
                                        <Icons.Download size={14} className="mr-1" /> 範本
                                    </button>
                                    
                                    <button onClick={() => mdmFileInputRef.current.click()} className="text-xs font-medium bg-emerald-50 border border-emerald-200 text-emerald-700 px-2 py-1.5 rounded hover:bg-emerald-100 flex items-center shadow-sm transition-transform active:scale-95" title="匯入 CSV">
                                        <Icons.Upload size={14} className="mr-1" /> 匯入
                                    </button>
                                    <input type="file" accept=".csv" ref={mdmFileInputRef} className="hidden" onChange={handleMdmFileUpload} />
                                    
                                    <div className="h-3 w-px bg-indigo-200 mx-0.5"></div>

                                    <button onClick={addMdmRow} className="text-xs font-medium bg-indigo-600 text-white px-2 py-1.5 rounded hover:bg-indigo-700 flex items-center shadow-sm transition-transform active:scale-95" title="手動新增">
                                        <Icons.Plus size={14} className="mr-1" /> 新增
                                    </button>
                                    
                                    <button onClick={clearMdmRows} className="text-xs font-medium bg-white border border-red-200 text-red-500 px-2 py-1.5 rounded hover:bg-red-50 flex items-center shadow-sm transition-transform active:scale-95">
                                        清空
                                    </button>
                                </div>
                            </div>
                            <div className="overflow-y-auto flex-1 p-2">
                                <table className="w-full text-left border-collapse text-xs">
                                    <thead className="sticky top-0 bg-white z-10 shadow-sm">
                                        <tr className="text-slate-500 border-b border-slate-200">
                                            <th className="py-2 px-2 font-medium">參數代碼 (Code)</th>
                                            <th className="py-2 px-2 font-medium">中文描述</th>
                                            <th className="py-2 px-2 font-medium w-1/3">數值定義 (Values)</th>
                                            <th className="py-2 px-2 font-medium text-center w-10">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {mdmEntries.length === 0 ? (
                                            <tr>
                                                <td colSpan="4" className="text-center py-12 text-slate-400">
                                                    尚未建立字典。<br/>請點選新增或匯入。
                                                </td>
                                            </tr>
                                        ) : mdmEntries.map((row) => (
                                            <tr key={row.id} className="hover:bg-slate-50">
                                                <td className="p-1"><input value={row.code} onChange={e=>updateMdmRow(row.id, 'code', e.target.value)} className="w-full p-1.5 border border-slate-200 rounded text-blue-700 font-mono focus:border-indigo-500 outline-none" placeholder="ONC_STAT"/></td>
                                                <td className="p-1"><input value={row.desc} onChange={e=>updateMdmRow(row.id, 'desc', e.target.value)} className="w-full p-1.5 border border-slate-200 rounded focus:border-indigo-500 outline-none" placeholder="疾病狀態"/></td>
                                                <td className="p-1"><input value={row.values} onChange={e=>updateMdmRow(row.id, 'values', e.target.value)} className="w-full p-1.5 border border-slate-200 rounded text-slate-500 focus:border-indigo-500 outline-none" placeholder="CUR 現症..."/></td>
                                                <td className="p-1 text-center">
                                                    <button onClick={()=>removeMdmRow(row.id)} className="text-red-400 hover:text-red-600 p-1 transition-transform hover:scale-110"><Icons.Trash2 size={16}/></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Right/Bottom: Disease Batch Input Table */}
                        <div className="xl:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[550px]">
                            <div className="p-4 border-b border-slate-100 bg-slate-50 flex flex-col md:flex-row md:justify-between md:items-center gap-3">
                                <h2 className="font-semibold text-slate-800 flex items-center">
                                    <Icons.FileText size={18} className="mr-2 text-blue-600" />
                                    疾病審查標準 (批次管理區)
                                </h2>
                                
                                {/* 核心新功能：CSV 匯入與範本下載按鈕群組 */}
                                <div className="flex flex-wrap items-center gap-2">
                                    <button onClick={downloadTemplate} className="text-xs font-medium bg-white border border-slate-300 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-50 flex items-center shadow-sm transition-transform active:scale-95">
                                        <Icons.Download size={14} className="mr-1.5" /> 下載範本
                                    </button>
                                    
                                    <button onClick={() => fileInputRef.current.click()} className="text-xs font-medium bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg hover:bg-emerald-100 flex items-center shadow-sm transition-transform active:scale-95">
                                        <Icons.Upload size={14} className="mr-1.5" /> 匯入 CSV
                                    </button>
                                    {/* 隱藏的 File Input */}
                                    <input type="file" accept=".csv" ref={fileInputRef} className="hidden" onChange={handleFileUpload} />
                                    
                                    <div className="h-4 w-px bg-slate-300 mx-1"></div>

                                    <button onClick={addDiseaseRow} className="text-xs font-medium bg-blue-600 text-white px-3 py-1.5 rounded-lg hover:bg-blue-700 flex items-center shadow-sm transition-transform active:scale-95">
                                        <Icons.Plus size={14} className="mr-1" /> 手動新增
                                    </button>
                                    
                                    <button onClick={clearDiseaseRows} className="text-xs font-medium bg-white border border-red-200 text-red-500 px-3 py-1.5 rounded-lg hover:bg-red-50 flex items-center shadow-sm transition-transform active:scale-95">
                                        清空
                                    </button>
                                </div>
                            </div>
                            <div className="overflow-y-auto overflow-x-auto flex-1 p-2">
                                <table className="w-full text-left border-collapse text-sm min-w-[800px]">
                                    <thead className="sticky top-0 bg-white z-10 shadow-sm">
                                        <tr className="text-slate-600 border-b border-slate-200 bg-white">
                                            <th className="py-2 px-3 font-semibold w-32">疾病名稱</th>
                                            <th className="py-2 px-3 font-semibold w-24">ICD 代碼</th>
                                            <th className="py-2 px-3 font-semibold w-24">規則前綴</th>
                                            <th className="py-2 px-3 font-semibold w-24">險種</th>
                                            <th className="py-2 px-3 font-semibold">審查標準原文 (支援多行貼上)</th>
                                            <th className="py-2 px-2 font-semibold text-center w-12">移除</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200">
                                        {diseaseEntries.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" className="text-center py-12 text-slate-400">
                                                    尚未建立資料。<br/>請點擊上方「手動新增」或「匯入 CSV」來批次載入規則。
                                                </td>
                                            </tr>
                                        ) : diseaseEntries.map((row, index) => (
                                            <tr key={row.id} className="hover:bg-slate-50/50 group">
                                                <td className="p-2 align-top"><input value={row.name} onChange={e=>updateDiseaseRow(row.id, 'name', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 outline-none" placeholder="例如: 乳癌"/></td>
                                                <td className="p-2 align-top"><input value={row.code} onChange={e=>updateDiseaseRow(row.id, 'code', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 outline-none" placeholder="ICD_C50"/></td>
                                                <td className="p-2 align-top"><input value={row.prefix} onChange={e=>updateDiseaseRow(row.id, 'prefix', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 outline-none" placeholder="BRE"/></td>
                                                <td className="p-2 align-top"><input value={row.type} onChange={e=>updateDiseaseRow(row.id, 'type', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 outline-none" placeholder="壽險"/></td>
                                                <td className="p-2 align-top">
                                                    <textarea value={row.text} onChange={e=>updateDiseaseRow(row.id, 'text', e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:border-blue-500 outline-none h-24 resize-y text-xs" placeholder="在此貼上核保手冊的規則文字..."/>
                                                </td>
                                                <td className="p-2 align-top text-center pt-4">
                                                    <button onClick={()=>removeDiseaseRow(row.id)} className="text-slate-300 hover:text-red-500 transition-colors hover:scale-110"><Icons.Trash2 size={18}/></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            
                            {/* Execution Panel */}
                            <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
                                <div className="text-sm text-slate-500 flex-1">
                                    {error && <span className="text-red-600 flex items-center font-medium"><Icons.AlertCircle size={16} className="mr-1"/> {error}</span>}
                                    {!error && <span>目前已載入 <strong className="text-blue-600">{diseaseEntries.length}</strong> 項疾病標準。</span>}
                                </div>
                                <button
                                    onClick={handleGenerate}
                                    disabled={isLoading || diseaseEntries.length === 0}
                                    className={`py-3 px-8 rounded-xl font-bold text-white flex items-center transition-all shadow-md ${isLoading || diseaseEntries.length === 0 ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 active:scale-95'}`}
                                >
                                    {isLoading ? <><Icons.Loader2 size={20} className="mr-2" /> 批次結構化解析中...</> : <>啟動 AI 聯合轉譯引擎 <Icons.ArrowRight size={20} className="ml-2" /></>}
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Bottom Output Section */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1 min-h-[500px]">
                        <div className="flex border-b border-slate-200 bg-slate-50">
                            <button onClick={() => setActiveOutputTab('matrix')} className={`flex-1 py-4 text-sm font-bold border-b-2 transition-colors ${activeOutputTab === 'matrix' ? 'border-blue-600 text-blue-700 bg-white' : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}>
                                整合決策矩陣表 (Decision Matrix)
                            </button>
                            <button onClick={() => setActiveOutputTab('dictionary')} className={`flex-1 py-4 text-sm font-bold border-b-2 transition-colors ${activeOutputTab === 'dictionary' ? 'border-blue-600 text-blue-700 bg-white' : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}>
                                全域參數代碼字典 (Global Data Dictionary)
                            </button>
                        </div>

                        <div className="flex-1 p-0 overflow-auto bg-slate-50/50">
                            {(matrixData.length === 0 && dictionaryData.length === 0 && !isLoading) ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400 p-16 text-center">
                                    <Icons.Database size={56} className="mb-4 opacity-20 text-blue-500" />
                                    <h3 className="text-lg font-semibold text-slate-600 mb-2">等待啟動批次引擎</h3>
                                    <p>請在上方匯入您的疾病資料，點擊「啟動引擎」後，<br/>系統將自動對齊變數，並產生可直接匯入企業關聯式資料庫的完整陣列。</p>
                                </div>
                            ) : (
                                <>
                                    {/* Matrix View */}
                                    {activeOutputTab === 'matrix' && (
                                        <div className="p-6 space-y-4">
                                            <div className="flex justify-between items-center mb-2">
                                                <p className="text-sm text-slate-500">此表格包含了您上傳的 <strong className="text-slate-700">所有疾病</strong>，並已確保 JSON 陣列雙引號符合 RFC 4180 CSV 匯入標準。</p>
                                                <button onClick={() => handleCopyCSV('matrix')} className="flex items-center px-4 py-2 bg-slate-800 text-white text-sm font-medium rounded-lg hover:bg-slate-700 shadow-sm transition-transform active:scale-95">
                                                    {copyStatus.matrix ? <Icons.CheckCircle2 size={16} className="mr-2 text-green-400" /> : <Icons.Copy size={16} className="mr-2" />}
                                                    {copyStatus.matrix ? '已複製到剪貼簿' : '一鍵複製 CSV'}
                                                </button>
                                            </div>
                                            <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm bg-white">
                                                <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                                                    <thead>
                                                        <tr className="bg-slate-100/80 border-b border-slate-200 text-slate-700">
                                                            <th className="p-3 font-bold">規則編號</th>
                                                            <th className="p-3 font-bold">險種</th>
                                                            <th className="p-3 font-bold">疾病代碼</th>
                                                            <th className="p-3 font-bold w-1/2">決策條件 (JSON Array)</th>
                                                            <th className="p-3 font-bold text-center">審查結果</th>
                                                            <th className="p-3 font-bold">規則說明</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {matrixData.map((row, idx) => (
                                                            <tr key={idx} className="hover:bg-blue-50/50 transition-colors">
                                                                <td className="p-3 font-mono text-blue-600 font-medium">{row.ruleId}</td>
                                                                <td className="p-3 text-slate-600">{row.insuranceType}</td>
                                                                <td className="p-3 font-mono text-slate-600">{row.diseaseCode}</td>
                                                                <td className="p-3"><div className="font-mono text-xs bg-slate-50 p-2.5 rounded border border-slate-200 overflow-x-auto max-w-[600px] text-slate-700 shadow-inner">{JSON.stringify(row.conditions)}</div></td>
                                                                <td className="p-3 text-center"><span className="inline-block bg-slate-800 text-white px-2 py-0.5 rounded font-bold">{row.result}</span></td>
                                                                <td className="p-3 text-slate-600">{row.description}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {/* Dictionary View */}
                                    {activeOutputTab === 'dictionary' && (
                                        <div className="p-6 space-y-4">
                                            <div className="flex justify-between items-center mb-2">
                                                <p className="text-sm text-slate-500">AI 已自動為您彙整了跨疾病的全局參數，這也是建立企業 MDM 資料庫的最佳雛形。</p>
                                                <button onClick={() => handleCopyCSV('dictionary')} className="flex items-center px-4 py-2 bg-slate-800 text-white text-sm font-medium rounded-lg hover:bg-slate-700 shadow-sm transition-transform active:scale-95">
                                                    {copyStatus.dict ? <Icons.CheckCircle2 size={16} className="mr-2 text-green-400" /> : <Icons.Copy size={16} className="mr-2" />}
                                                    {copyStatus.dict ? '已複製到剪貼簿' : '一鍵複製 CSV'}
                                                </button>
                                            </div>
                                            <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm bg-white">
                                                <table className="w-full text-left border-collapse text-sm whitespace-nowrap">
                                                    <thead>
                                                        <tr className="bg-slate-100/80 border-b border-slate-200 text-slate-700">
                                                            <th className="p-3 font-bold">分類</th>
                                                            <th className="p-3 font-bold">參數代碼 (Code)</th>
                                                            <th className="p-3 font-bold">中文描述</th>
                                                            <th className="p-3 font-bold">數值代碼 (Value)</th>
                                                            <th className="p-3 font-bold">數值定義</th>
                                                            <th className="p-3 font-bold">適用疾病</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {dictionaryData.map((row, idx) => (
                                                            <tr key={idx} className="hover:bg-blue-50/50 transition-colors">
                                                                <td className="p-3 text-slate-500 font-medium">{row.category}</td>
                                                                <td className="p-3 font-mono text-indigo-600 font-bold">{row.code}</td>
                                                                <td className="p-3 font-medium text-slate-800">{row.description}</td>
                                                                <td className="p-3 font-mono text-emerald-600 font-medium">{row.valueCode}</td>
                                                                <td className="p-3 text-slate-600">{row.valueDefinition}</td>
                                                                <td className="p-3"><span className={`inline-block px-2 py-0.5 rounded text-xs font-semibold ${row.disease === '通用' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-600'}`}>{row.disease}</span></td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
